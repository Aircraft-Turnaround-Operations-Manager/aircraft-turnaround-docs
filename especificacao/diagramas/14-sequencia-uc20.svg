l="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="476.8828" x="11" y="165.6523">Pr&#233;-condi&#231;&#227;o: o TarefaService aceitou um registro de in&#237;cio (UC15), de conclus&#227;o (UC16)</text><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="474.082" x="11" y="179.4512">ou de "N&#227;o aplic&#225;vel" (UC18), com o turnaround travado (buscarComTrava). A pausa e a</text><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="275.4727" x="11" y="193.25">retomada (UC17) n&#227;o acionam o Motor de Eventos.</text><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="455.584" x="11" y="207.0488">E1: o registro feito sem conex&#227;o chega pelo mesmo caminho e traz o hor&#225;rio da a&#231;&#227;o</text><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="446.8711" x="11" y="220.8477">guardado no celular (registro.horarioAcao), que &#233; o hor&#225;rio do marco (RN4; RNF-8).</text><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="456.9375" x="11" y="234.6465">E2: o registro recusado no servidor &#233; recusado antes do &#171;include&#187; (passo 6 do UC15,</text><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="491.5957" x="11" y="248.4453">UC16 ou UC18): o MarcoService n&#227;o &#233; chamado, e nenhum marco &#233; gravado nem alterado.</text><g class="message" data-entity-1="part1" data-entity-2="part2" id="msg1"><polygon fill="#181818" points="363.7539,290.5859,373.7539,294.5859,363.7539,298.5859" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="141.6777" x2="369.7539" y1="294.5859" y2="294.5859"/><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="148.7227" x="148.6777" y="276.2441">registrarMarcos(turnaround,</text><text 