ust="spacing" textLength="296.7891" x="1004" y="691.623">maior atraso de fim) e os minutos de impacto (passo 5).</text><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="318.8438" x="1004" y="705.4219">RN9: hor&#225;rios da a&#231;&#227;o do operador, inclusive sem conex&#227;o.</text><g class="message" data-entity-1="part6" data-entity-2="part13" id="msg48"><polygon fill="#181818" points="2001.3779,733.7637,2011.3779,737.7637,2001.3779,741.7637" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="993.1084" x2="2007.3779" y1="737.7637" y2="737.7637"/><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="146.0625" x="1000.1084" y="733.2207">buscarUltima(turnaroundId)</text></g><g class="message" data-entity-1="part13" data-entity-2="part17" id="msg49"><polygon fill="#181818" points="2688.625,761.5625,2698.625,765.5625,2688.625,769.5625" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="2023.3779" x2="2694.625" y1="765.5625" y2="765.5625"/><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="46.6816" x="2030.3779" y="761.0195">SELECT</text><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="3.334" x="2077.0596" y="761.0195">&#160;</text><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="46.0313" x="2080.3936" y="761.0195">projecao</text><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="3.334" x="2126.4248" y="761.0195">&#160;</text><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="10.6699" x="2129.7588" y="761.0195">(a</text><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="3.334" x="2140.4287" y="761.0195">&#160;</text><text fill="#000000" font-family="Arial" font-size="12" lengthA