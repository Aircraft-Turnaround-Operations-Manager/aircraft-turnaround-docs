27;o que falta;</text><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="395.2734" x="1020" y="640.3887">"Aguardando" ou "Pronta" &#8594; maior entre in&#237;cio planejado, fim das</text><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="383.9473" x="1020" y="654.3574">predecessoras e agora, + dura&#231;&#227;o (A4: sem AIBT, todas assim).</text><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="204.9551" x="1020" y="668.3262">A2: "N&#227;o aplic&#225;vel" sai do c&#225;lculo.</text><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="394.4297" x="1020" y="682.2949">RN3: proje&#231;&#227;o = maior fim projetado das obrigat&#243;rias; desvios do</text><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="237.2637" x="1020" y="696.2637">TOBT planejado e do vigente (passo 4).</text><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="363.3105" x="1020" y="710.2324">RN4 e RN5: atraso de in&#237;cio e de fim em minutos completos;</text><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="390.9375" x="1020" y="724.2012">sucessora "impactada" com a tarefa de origem (no empate, a de</text><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="338.4434" x="1020" y="738.1699">maior atraso de fim) e os minutos de impacto (passo 5).</text><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="357.9258" x="1020" y="752.1387">RN9: hor&#225;rios da a&#231;&#227;o do operador, inclusive sem conex&#227;o.</text><g class="message" data-entity-1="part6" data-entity-2="part13" id="msg43"><polygon fill="#181818" points="2088.5635,780.9375,2098.5635,784.9375,2088.5635,788.9375" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke