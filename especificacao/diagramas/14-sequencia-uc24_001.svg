 aplic&#225;vel" sai do c&#225;lculo.</text><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="394.4297" x="1020" y="682.2949">RN3: proje&#231;&#227;o = maior fim projetado das obrigat&#243;rias; desvios do</text><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="237.2637" x="1020" y="696.2637">TOBT planejado e do vigente (passo 4).</text><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="363.3105" x="1020" y="710.2324">RN4 e RN5: atraso de in&#237;cio e de fim em minutos completos;</text><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="390.9375" x="1020" y="724.2012">sucessora "impactada" com a tarefa de origem (no empate, a de</text><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="338.4434" x="1020" y="738.1699">maior atraso de fim) e os minutos de impacto (passo 5).</text><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="357.9258" x="1020" y="752.1387">RN9: hor&#225;rios da a&#231;&#227;o do operador, inclusive sem conex&#227;o.</text><g class="message" data-entity-1="part6" data-entity-2="part13" id="msg59"><polygon fill="#181818" points="2088.5635,780.9375,2098.5635,784.9375,2088.5635,788.9375" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="1009.0195" x2="2094.5635" y1="784.9375" y2="784.9375"/><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="167.3848" x="1016.0195" y="780.1074">buscarUltima(turnaroundId)</text></g><g class="message" data-entity-1="part13" data-entity-2="part18" id="msg60"><polygon fill="#181818" points="3028.4141,808.9063,3038.4141,812.9063,3028.4141,816.9063" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="2110.5635" x2="3034.4141" y1="812.9063" y2="812.9063"/><text fill="#000000