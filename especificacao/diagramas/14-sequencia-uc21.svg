/g><g><title>..publisher..</title><rect fill="#FFFFFF" height="27.7988" style="stroke:#181818;stroke-width:1;" width="10" x="972.8057" y="635.7637"/></g><g><title>..publisher..</title><rect fill="#FFFFFF" height="27.7988" style="stroke:#181818;stroke-width:1;" width="10" x="972.8057" y="1530.5156"/></g><g><title>..publisher..</title><rect fill="#FFFFFF" height="27.7988" style="stroke:#181818;stroke-width:1;" width="10" x="972.8057" y="2148.4805"/></g><g><title>..publisher..</title><rect fill="#FFFFFF" height="74.3965" style="stroke:#181818;stroke-width:1;" width="10" x="972.8057" y="2435.0664"/></g><g><title>..publisher..</title></g><g><title>..publisher..</title></g><rect fill="#EEEEEE" height="3" style="stroke:#EEEEEE;stroke-width:1;" width="1770.748" x="0" y="122.4971"/><line style="stroke:#000000;stroke-width:1;" x1="0" x2="1770.748" y1="122.4971" y2="122.4971"/><line style="stroke:#000000;stroke-width:1;" x1="0" x2="1770.748" y1="125.4971" y2="125.4971"/><rect fill="#EEEEEE" height="21.7988" style="stroke:#000000;stroke-width:2;" width="206.0762" x="782.3359" y="112.5977"/><text fill="#000000" font-family="Arial" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="188.7422" x="788.3359" y="127.8535">Passo 1: registro de tarefa aceito</text><path d="M5,149.3965 L5,241.3965 L661,241.3965 L661,159.3965 L651,149.3965 L5,149.3965" fill="#FFFDE7" style="stroke:#BDBDBD;stroke-width:0.5;"/><path d="M651,149.3965 L651,159.3965 L661,159.3965 L651,149.3965" fill="#FFFDE7" style="stroke:#BDBDBD;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="623.6484" x="11" y="165.6523">O TarefaService chama o PropagacaoService depois de gravar o registro na tarefa (UC15, UC16 ou UC18, passo 8).</text><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="635.0684" x="11" y="179.4512">E1: o registro recusado no servidor &#233; recusado antes do &#171;include&#187;: nenhuma tarefa nem o turnaround muda de estado.</text><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="623.7598" x="11" y="193.25">E2: o registro feito sem conex&#227;o que chega depois de outros &#233; propagado quando chega; a mudan&#231;a grava o hor&#225;rio</text><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="582.3164" x="11" y="207.0488">em que acontece (ocorrido_em) e o registro que a causou (causa_id), que guarda o hor&#225;rio da a&#231;&#227;o (RNF-8).</text><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="560.8652" x="11" y="220.8477">RN9: com o turnaround "Em exce&#231;&#227;o", a propaga&#231;&#227;o entre as tarefas segue igual; a entrada e a sa&#237;da de</text><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="221.2852" x="11" y="234.6465">"Em exce&#231;&#227;o" ficam no UC29 e no UC33.</text><g class="message" data-entity-1="part1" data-entity-2="part2" id="msg1"><polygon fill="#181818" points="440.8086,276.7871,450.8086,280.7871,440.8086,284.7871" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="207.6777" x2="446.8086" y1="280.7871" y2="280.7871"/><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="158.0918" x="214.6777" y="262.4453">propagarRegistro(turnaround,</text><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="3.334" x="372.7695" y="262.4453">&#160;</text><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="34.0195" x="376.1035" y="262.4453">tarefa,</text><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="44.0098" x="214.6777" y="276.2441">registro)</text></g><path d="M352.4434,295.7871 L411.4473,295.7871 L411.4473,301.5859 L401.4473,311.5859 L352.4434,311.5859 L352.4434,295.7871" fill="#EEEEEE" style="stroke:#000000;stroke-width:1.5;"/><rect fill="none" height="2006.4863" style="stroke:#000000;stroke-width:1.5;" width="1183.9102" x="352.4434" y="295.7871"/><text fill="#000000" font-family="Arial" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="14.0039" x="367.4434" y="308.043">alt</text><text fill="#000000" font-family="Arial" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="473.4727" x="426.4473" y="309.043">[A1: registro.tipo = "In&#237;cio" e turnaround.estado = "Em solo" (primeiro in&#237;cio; RN2)]</text><g class="message" data-entity-1="part2" data-entity-2="part3" id="msg2"><polygon fill="#181818" points="683.707,354.9824,693.707,358.9824,683.707,362.9824" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="462.8086" x2="689.707" y1="358.9824" y2="358.9824"/><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="101.3906" x="469.8086" y="326.8418">mudarEstado(novo</text><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="3.334" x="571.1992" y="326.8418">&#160;</text><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="7.0078" x="574.5332" y="326.8418">=</text><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="3.334" x="581.541" y="326.8418">&#160;</text><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="62.959" x="584.875" y="326.8418">"Opera&#231;&#245;es</text><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="3.334" x="647.834" y="326.8418">&#160;</text><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="16.6699" x="651.168" y="326.8418">em</text><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="67.6406" x="469.8086" y="340.6406">andamento",</text><text fill