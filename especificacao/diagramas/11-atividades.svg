<?plantuml 1.2026.0?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="ACTIVITY" height="1528px" preserveAspectRatio="none" style="width:2675px;height:1528px;background:#FFFFFF;" version="1.1" viewBox="0 0 2675 1528" width="2675px" zoomAndPan="magnify"><title>Aircraft Turnaround Orchestration System
11.1 &#8212; Ciclo de vida do turnaround</title><defs/><g><g class="title" data-source-line="2"><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="281.6133" x="1195.506" y="34.5332">Aircraft Turnaround Orchestration System</text><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="235.3613" x="1218.632" y="52.1426">11.1 &#8212; Ciclo de vida do turnaround</text></g><rect fill="none" height="18.8672" style="stroke:none;stroke-width:1;" width="2642.6252" x="15" y="68.0146"/><ellipse cx="394.0557" cy="101.8818" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1;"/><rect fill="#EEF4FA" height="76.6016" rx="12.5" ry="12.5" style="stroke:#34536E;stroke-width:0.5;" width="278.457" x="254.8271" y="131.8818"/><text fill="#000000" font-family="sans-serif" font-size="15" lengthAdjust="spacing" textLength="218.4448" x="264.8271" y="157.4531">Abrir turnaround; aplicar modelo;</text><text fill="#000000" font-family="sans-serif" font-size="15" lengthAdjust="spacing" textLength="258.457" x="264.8271" y="176.3203">atribuir respons&#225;veis e confirmar plano</text><text fill="#000000" font-family="sans-serif" font-size="15" lengthAdjust="spacing" textLength="161.6821" x="264.8271" y="195.1875">(UC-A3, UC-A6, UC-A5)</text><rect fill="#EEF4FA" height="76.6016" rx="12.5" ry="12.5" style="stroke:#34536E;stroke-width:0.5;" width="248.4204" x="269.8455" y="416.5186"/><text fill="#000000" font-family="sans-serif" font-size="15" lengthAdjust="spacing" textLength="228.4204" x="279.8455" y="442.0898">Tratar risco; ajustar refer&#234;ncias ou</text><text fill="#000000" font-family="sans-serif" font-size="15" lengthAdjust="spacing" textLength="165.0806" x="279.8455" y="460.957">previs&#227;o e registrar a&#231;&#227;o</text><text fill="#000000" font-family="sans-serif" font-size="15" lengthAdjust="spacing" textLength="171.6797" x="279.8455" y="479.8242">(UC-A10, UC-D6, UC-D3)</text><rect fill="#EEF4FA" height="76.6016" rx="12.5" ry="12.5" style="stroke:#34536E;stroke-width:0.5;" width="265.127" x="21" y="1038.2256"/><text fill="#000000" font-family="sans-serif" font-size="15" lengthAdjust="spacing" textLength="245.127" x="31" y="1063.7969">Tratar pend&#234;ncias; encerrar exce&#231;&#227;o</text><text fill="#000000" font-family="sans-serif" font-size="15" lengthAdjust="spacing" textLength="216.7749" x="31" y="1082.6641">somente com solu&#231;&#227;o registrada</text><text fill="#000000" font-family="sans-serif" font-size="15" lengthAdjust="spacing" textLength="55.8252" x="31" y="1101.5313">(UC-D5)</text><line style="stroke:#000000;stroke-width:1.5;" x1="15" x2="15" y1="68.0146" y2="1516.8975"/><rect fill="#EEF4FA" height="57.7344" rx="12.5" ry="12.5" style="stroke:#34536E;stroke-width:0.5;" width="273.4985" x="775.002" y="228.4834"/><text fill="#000000" font-family="sans-serif" font-size="15" lengthAdjust="spacing" textLength="253.4985" x="785.002" y="254.0547">Verificar viabilidade antes da chegada</text><text fill="#000000" font-family="sans-serif" font-size="15" lengthAdjust="spacing" textLength="54.1553" x="785.002" y="272.9219">(RF-C8)</text><rect fill="#EEF4FA" height="38.8672" rx="12.5" ry="12.5" style="stroke:#34536E;stroke-width:0.5;" width="156.7065" x="833.3979" y="357.6514"/><text fill="#000000" font-family="sans-serif" font-size="15" lengthAdjust="spacing" textLength="136.7065" x="843.3979" y="383.2227">Emitir alerta de risco</text><polygon fill="#EEF4FA" points="807.5569,306.2178,1015.9456,306.2178,1027.9456,318.2178,1015.9456,330.2178,807.5569,330.2178,795.5569,318.2178,807.5569,306.2178" style="stroke:#34536E;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="15" lengthAdjust="spacing" textLength="31.6626" x="915.7512" y="345.7891">[sim]</text><text fill="#000000" font-family="sans-serif" font-size="15" lengthAdjust="spacing" textLength="208.3887" x="807.5569" y="324.3555">EIBT + MTTT &gt; TOBT vigente?</text><text fill="#000000" font-family="sans-serif" font-size="15" lengthAdjust="spacing" textLength="33.3618" x="1027.9456" y="314.9219">[n&#227;o]</text><polygon fill="#EEF4FA" points="911.7512,513.1201,923.7512,525.1201,911.7512,537.1201,899.7512,525.1201,911.7512,513.1201" style="stroke:#34536E;stroke-width:0.5;"/><path d="M1055.533,639.8545 L1055.533,669.1553 L1035.533,673.1553 L1055.533,677.1553 L1055.533,706.4561 A0,0 0 0 0 1055.533,706.4561 L1392.573,706.4561 A0,0 0 0 0 1392.573,706.4561 L1392.573,649.8545 L1382.573,639.8545 L1055.533,639.8545 A0,0 0 0 0 1055.533,639.8545" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M1382.573,639.8545 L1382.573,649.8545 L1392.573,649.8545 L1382.573,639.8545" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="15" lengthAdjust="spacing" textLength="316.04" x="1061.533" y="660.4258">Chegada registrada diretamente pelo operador.</text><text fill="#000000" font-family="sans-serif" font-size="15" lengthAdjust="spacing" textLength="310.144" x="1061.533" y="679.293">Coordenador pode corrigir o hor&#225;rio (UC-A13),</text><text fill="#000000" font-family="sans-serif" font-size="15" lengthAdjust="spacing" textLength="219.2798" x="1061.533" y="698.1602">sem alterar o estado das tarefas.</text><rect fill="#EEF4FA" height="76.6016" rx="12.5" ry="12.5" style="stroke:#34536E;stroke-width:0.5;" width="247.5635" x="787.9695" y="634.8545"/><text fill="#000000" font-family="sans-serif" font-size="15" lengthAdjust="spacing" textLength="227.5635" x="797.9695" y="660.4258">Gravar AIBT; colocar em Em solo;</text><text fill="#000000" font-family="sans-serif" font-size="15" lengthAdjust="spacing" textLength="192.6196" x="797.9695" y="679.293">propagar tarefas para Pronta</text><text fill="#000000" font-family="sans-serif" font-size="15" lengthAdjust="spacing" textLength="54.9976" x="797.9695" y="698.1602">(UC-B8)</text><rect fill="#EEF4FA" height="38.8672" rx="12.5" ry="12.5" style="stroke:#34536E;stroke-width:0.5;" width="226.792" x="557.863" y="979.3584"/><text fill="#000000" font-family="sans-serif" font-size="15" lengthAdjust="spacing" textLength="206.792" x="567.863" y="1004.9297">Manter confirma&#231;&#227;o bloqueada</text><rect fill="#EEF4FA" height="57.7344" rx="12.5" ry="12.5" style="stroke:#34536E;stroke-width:0.5;" width="255.9497" x="543.2842" y="1149.8271"/><text fill="#000000" font-family="sans-serif" font-size="15" lengthAdjust="spacing" textLength="235.9497" x="553.2842" y="1175.3984">Restaurar estado conforme tarefas;</text><text fill="#000000" font-family="sans-serif" font-size="15" lengthAdjust="spacing" textLength="141.7456" x="553.2842" y="1194.2656">propagar e recalcular</text><polygon fill="#EEF4FA" points="973.375,1038.2256,1331.1118,1038.2256,1343.1118,1050.2256,1331.1118,1062.2256,973.375,1062.2256,961.375,1050.2256,973.375,1038.2256" style="stroke:#34536E;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="15" lengthAdjust="spacing" textLength="357.7368" x="973.375" y="1056.3633">Estado Pronto para libera&#231;&#227;o e sem nova pend&#234;ncia?</text><text fill="#000000" font-family="sans-serif" font-size="15" lengthAdjust="spacing" textLength="31.6626" x="929.7124" y="1046.9297">[sim]</text><text fill="#000000" font-family="sans-serif" font-size="15" lengthAdjust="spacing" textLength="33.3618" x="1343.1118" y="1046.9297">[n&#227;o]</text><rect fill="#EEF4FA" height="38.8672" rx="12.5" ry="12.5" style="stroke:#34536E;stroke-width:0.5;" width="235.105" x="833.8225" y="1072.2256"/><text fill="#000000" font-family="sans-serif" font-size="15" lengthAdjust="spacing" textLength="215.105" x="843.8225" y="1097.7969">Gravar ARDT e estado Liberado</text><rect fill="#EEF4FA" height="57.7344" rx="12.5" ry="12.5" style="stroke:#34536E;stroke-width:0.5;" width="273.4106" x="1216.4065" y="1072.2256"/><text fill="#000000" font-family="sans-serif" font-size="15" lengthAdjust="spacing" textLength="253.4106" x="1226.4065" y="1097.7969">Recusar confirma&#231;&#227;o; mostrar motivo;</text><text fill="#000000" font-family="sans-serif" font-size="15" lengthAdjust="spacing" textLength="112.5586" x="1226.4065" y="1116.6641">preservar estado</text><polygon fill="#EEF4FA" points="1152.2434,1135.96,1164.2434,1147.96,1152.2434,1159.96,1140.2434,1147.96,1152.2434,1135.96" style="stroke:#34536E;stroke-width:0.5;"/><polygon fill="#EEF4FA" points="911.7512,731.4561,923.7512,743.4561,911.7512,755.4561,899.7512,743.4561,911.7512,731.4561" style="stroke:#34536E;stroke-width:0.5;"/><polygon fill="#EEF4FA" points="802.4995,1261.5615,1021.0029,1261.5615,1033.0029,1273.5615,1021.0029,1285.5615,802.4995,1285.5615,790.4995,1273.5615,802.4995,1261.5615" style="stroke:#34536E;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="15" lengthAdjust="spacing" textLength="33.3618" x="915.7512" y="1301.1328">[n&#227;o]</text><text fill="#000000" font-family="sans-serif" font-size="15" lengthAdjust="spacing" textLength="218.5034" x="802.4995" y="1279.6992">Turnaround ainda n&#227;o Liberado?</text><text fill="#000000" font-family="sans-serif" font-size="15" lengthAdjust="spacing" textLength="31.6626" x="1033.0029" y="1270.2656">[sim]</text><rect fill="#EEF4FA" height="76.6016" rx="12.5" ry="12.5" style="stroke:#34536E;stroke-width:0.5;" width="276.7725" x="773.365" y="1398.2959"/><text fill="#000000" font-family="sans-serif" font-size="15" lengthAdjust="spacing" textLength="256.7725" x="783.365" y="1423.8672">Gravar AOBT; passar a Fora de bloco;</text><text fill="#000000" font-family="sans-serif" font-size="15" lengthAdjust="spacing" textLength="230.9399" x="783.365" y="1442.7344">recusar novos registros de tarefas;</text><text fill="#000000" font-family="sans-serif" font-size="15" lengthAdjust="spacing" textLength="123.3765" x="783.365" y="1461.6016">preservar hist&#243;rico</text><ellipse cx="911.7512" cy="1505.8975" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1;"/><ellipse cx="911.7512" cy="1505.8975" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1;"/><line style="stroke:#000000;stroke-width:1.5;" x1="537.2842" x2="537.2842" y1="68.0146" y2="1516.8975"/><rect fill="#EEF4FA" height="57.7344" rx="12.5" ry="12.5" style="stroke:#34536E;stroke-width:0.5;" width="240.1294" x="1530.2603" y="557.1201"/><text fill="#000000" font-family="sans-serif" font-size="15" lengthAdjust="spacing" textLength="220.1294" x="1540.2603" y="582.6914">Registrar chegada real &#224; posi&#231;&#227;o</text><text fill="#000000" font-family="sans-serif" font-size="15" lengthAdjust="spacing" textLength="63.3398" x="1540.2603" y="601.5586">(UC-A12)</text><path d="M1774.54,771.0225 L1774.54,800.3232 L1754.54,804.3232 L1774.54,808.3232 L1774.54,837.624 A0,0 0 0 0 1774.54,837.624 L2086.5386,837.624 A0,0 0 0 0 2086.5386,837.624 L2086.5386,781.0225 L2076.5386,771.0225 L1774.54,771.0225 A0,0 0 0 0 1774.54,771.0225" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M2076.5386,771.0225 L2076.5386,781.0225 L2086.5386,781.0225 L2076.5386,771.0225" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="15" lengthAdjust="spacing" textLength="220.1294" x="1780.54" y="791.5938">Cada registro segue a vista 11.3.</text><text fill="#000000" font-family="sans-serif" font-size="15" lengthAdjust="spacing" textLength="290.9985" x="1780.54" y="810.4609">Monitoramento e interven&#231;&#245;es da vista 11.4</text><text fill="#000000" font-family="sans-serif" font-size="15" lengthAdjust="spacing" textLength="289.3506" x="1780.54" y="829.3281">ocorrem durante a execu&#231;&#227;o, n&#227;o ap&#243;s ela.</text><rect fill="#EEF4FA" height="57.7344" rx="12.5" ry="12.5" style="stroke:#34536E;stroke-width:0.5;" width="208.4302" x="1546.1099" y="775.4561"/><text fill="#000000" font-family="sans-serif" font-size="15" lengthAdjust="spacing" textLength="188.4302" x="1556.1099" y="801.0273">Executar tarefas dispon&#237;veis</text><text fill="#000000" font-family="sans-serif" font-size="15" lengthAdjust="spacing" textLength="165.9155" x="1556.1099" y="819.8945">em paralelo &#8212; vista 11.2</text><path d="M1820.8328,1325.5615 L1820.8328,1345.4287 L1800.8328,1349.4287 L1820.8328,1353.4287 L1820.8328,1373.2959 A0,0 0 0 0 1820.8328,1373.2959 L2113.6785,1373.2959 A0,0 0 0 0 2113.6785,1373.2959 L2113.6785,1335.5615 L2103.6785,1325.5615 L1820.8328,1325.5615 A0,0 0 0 0 1820.8328,1325.5615" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M2103.6785,1325.5615 L2103.6785,1335.5615 L2113.6785,1335.5615 L2103.6785,1325.5615" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="15" lengthAdjust="spacing" textLength="271.8457" x="1826.8328" y="1346.1328">Autoriza&#231;&#227;o do controle de tr&#225;fego a&#233;reo</text><text fill="#000000" font-family="sans-serif" font-size="15" lengthAdjust="spacing" textLength="168.4204" x="1826.8328" y="1365">recebida fora do sistema.</text><rect fill="#EEF4FA" height="57.7344" rx="12.5" ry="12.5" style="stroke:#34536E;stroke-width:0.5;" width="301.0156" x="1499.8171" y="1320.5615"/><text fill="#000000" font-family="sans-serif" font-size="15" lengthAdjust="spacing" textLength="281.0156" x="1509.8171" y="1346.1328">Ap&#243;s autoriza&#231;&#227;o externa de acionamento</text><text fill="#000000" font-family="sans-serif" font-size="15" lengthAdjust="spacing" textLength="245.918" x="1509.8171" y="1365">e push-back, registrar sa&#237;da (UC-D9)</text><line style="stroke:#000000;stroke-width:1.5;" x1="1493.8171" x2="1493.8171" y1="68.0146" y2="1516.8975"/><rect fill="#EEF4FA" height="57.7344" rx="12.5" ry="12.5" style="stroke:#34536E;stroke-width:0.5;" width="216.7651" x="2197.3899" y="857.624"/><text fill="#000000" font-family="sans-serif" font-size="15" lengthAdjust="spacing" textLength="196.7651" x="2207.38